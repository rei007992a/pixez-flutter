name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.7.x'

      - name: Calculate Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4
        with:
          overrideConfig: |
            assembly-versioning-scheme=MajorMinorPatchTag
            assembly-file-versioning-format="{Major}.{Minor}.{Patch}.{BuildMetaData ?? 0}"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install Android Rust Targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Get Dependencies
        run: flutter pub get --no-example --enforce-lockfile

      - name: Generate Code (rhttp)
        working-directory: plugins/rhttp/rhttp
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate Code (PixEz)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PixEz-AI-Translate-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
